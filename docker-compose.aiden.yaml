# docker-compose.aiden.yaml
# Pelian Open WebUI deployment for Aiden integration
#
# NOTE: PostgreSQL has been consolidated into the Aiden storage stack.
# Data lives in aiden-postgres on ZFS-backed /mnt/aiden-core/postgres/data.
# See: aiden/deploy/aiden/docker-compose.storage.yaml

services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - USE_SLIM=true
    image: pelian-open-webui:aiden
    container_name: pelian-open-webui
    env_file:
      - .env.aiden
    volumes:
      - pelian-webui-data:/app/backend/data
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      # Database - Uses consolidated Aiden postgres (ZFS-backed)
      - "DATABASE_URL=postgresql://openwebui:openwebui@aiden-postgres:5432/openwebui"
      - "WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-pelian-aiden-secret-change-me}"
      - "OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:8080}"
      - "AIDEN_API_BASE_URL=${AIDEN_API_BASE_URL:-http://host.docker.internal:8099}"
      - "ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}"
      - "ENABLE_ADMIN_EXPORT=true"
      - "AIOHTTP_CLIENT_SESSION_SSL=false"
      - "CORS_ALLOW_ORIGIN=*"
      - "FORWARDED_ALLOW_IPS=*"
      - "SCARF_NO_ANALYTICS=true"
      - "DO_NOT_TRACK=true"
      - "ANONYMIZED_TELEMETRY=false"
      # Vaticore/World Knowledge web search
      - "ENABLE_WEB_SEARCH=true"
      - "WEB_SEARCH_ENGINE=vaticore"
      - "VATICORE_URL=${VATICORE_URL:-http://host.docker.internal:8010}"
      - "WEB_SEARCH_RESULT_COUNT=5"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pelian-net
      - aiden-storage  # Connect to consolidated storage stack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  pelian-net:
    driver: bridge
  aiden-storage:
    external: true
    name: aiden_storage-net  # From aiden/deploy/aiden/docker-compose.storage.yaml

volumes:
  pelian-webui-data:
  # pelian-postgres-data removed - data migrated to consolidated postgres
